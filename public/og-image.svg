<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- Subtle gradient overlay -->
  <defs>
    <radialGradient id="bg-grad" cx="30%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1E40AF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-grad2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <rect width="1200" height="630" fill="url(#bg-grad2)"/>

  <!-- Logo icon (centered-left) -->
  <g transform="translate(120, 195) scale(3.75)">
    <g fill="#1E40AF">
      <circle cx="32" cy="32" r="24"/>
      <rect x="29" y="2" width="6" height="8" rx="1"/>
      <rect x="29" y="54" width="6" height="8" rx="1"/>
      <rect x="2" y="29" width="8" height="6" rx="1"/>
      <rect x="54" y="29" width="8" height="6" rx="1"/>
      <rect x="9" y="9" width="6" height="8" rx="1" transform="rotate(-45 12 13)"/>
      <rect x="49" y="9" width="6" height="8" rx="1" transform="rotate(45 52 13)"/>
      <rect x="9" y="47" width="6" height="8" rx="1" transform="rotate(45 12 51)"/>
      <rect x="49" y="47" width="6" height="8" rx="1" transform="rotate(-45 52 51)"/>
    </g>
    <circle cx="32" cy="32" r="18" fill="#0F3570"/>
    <path d="M32 14 C34 20, 40 22, 40 30 C40 36, 36 40, 32 40 C28 40, 24 36, 24 30 C24 24, 28 24, 32 14 Z" fill="#F97316"/>
    <path d="M32 22 C33 25, 36 26, 36 30 C36 34, 34 36, 32 36 C30 36, 28 34, 28 30 C28 27, 30 27, 32 22 Z" fill="#FB923C"/>
  </g>

  <!-- Text -->
  <text x="460" y="320" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="90" fill="#fafafa">
    <tspan>Fake</tspan><tspan fill="#F97316">Forge</tspan>
    <tspan font-size="42" fill="#F97316" baseline-shift="super"> BR</tspan>
  </text>
  <text x="460" y="390" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="32" fill="#a1a1aa">
    Gerador de dados brasileiros para testes
  </text>
  <text x="460" y="460" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#71717a">
    CPF · CNPJ · PIX · Cartão · Pessoa completa — todos válidos
  </text>

  <!-- Bottom URL -->
  <text x="460" y="540" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="22" fill="#1E40AF">
    fakeforge.com.br
  </text>
</svg>
